version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexustheme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexustheme-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO withdrew its public images (minio/minio, minio/mc). Chainguard
  # rebuilds the same MinIO server from source; aws-cli creates the bucket.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: nexustheme-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: amazon/aws-cli:latest
    container_name: nexustheme-minio-init
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1 && break; sleep 2; done;
      aws --endpoint-url http://minio:9000 s3 mb s3://marketplace-dev 2>/dev/null || true;
      aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket marketplace-dev --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::marketplace-dev/public/*\"]}]}';
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
