name: CI

# Single required check for every PR into main (replaces phase9..phase18-ci.yml).
# Branch protection: require "CI / verify", "CI / e2e-fullstack" and "CI / docker" to pass before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace
      REDIS_URL: redis://localhost:6379
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: marketplace-dev
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_REGION: auto
      WEB_URL: http://localhost:3000
      PORTAL_URL: http://localhost:3001
      ADMIN_URL: http://localhost:3002
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_DEV_AUTH_ENABLED: "true"
      PAYMENT_RETURN_BASE_URL: http://localhost:3001
      STRIPE_MOCK_CLIENT: "true"
      STRIPE_SECRET_KEY: sk_test_placeholder_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret
      STRIPE_WEBHOOK_TOLERANCE_SECONDS: "300"
      ENABLE_TEST_PAYMENT_PROVIDER: "true"
      TEST_PAYMENT_WEBHOOK_SECRET: ci-test-payment-secret
      LICENSE_KEY_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      HOSTING_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SEED_DEV_USERS: "true"
      AUTOMATION_SERVICE_SECRET: test-automation-secret-minimum-32-chars-long
      N8N_WEBHOOK_BASE_URL: http://localhost:5678
      INTERNAL_HMAC_MAX_SKEW_SECONDS: "300"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      # pnpm 11 requires Node >= 22.13 (Node 20 broke every Phase 15-18 run).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # MinIO withdrew its public images (Docker Hub minio/minio and
      # quay.io/minio/* no longer resolve). Chainguard rebuilds the same MinIO
      # server from source; aws-cli replaces the withdrawn `mc` client.
      - name: Start PostgreSQL and Redis
        run: |
          docker compose up -d postgres redis
          for i in {1..40}; do
            if docker exec nexustheme-postgres pg_isready -U postgres -d marketplace >/dev/null 2>&1 && \
               docker exec nexustheme-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Start private MinIO
        run: |
          docker run -d --name nexustheme-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data --console-address ':9001'
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs nexustheme-minio
          exit 1

      - name: Create private MinIO bucket
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=minioadmin -e AWS_SECRET_ACCESS_KEY=minioadmin -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli:latest --endpoint-url http://127.0.0.1:9000 s3 mb s3://marketplace-dev

      - name: Setup test database
        run: |
          pnpm db:generate
          pnpm db:migrate
          # system RBAC + dev users (dev-admin-token -> admin role) + catalog;
          # Phase 5-7 need the seeded admin. seed:all omits dev users.
          pnpm db:seed:local

      - name: Verify operational shell scripts
        run: |
          bash -n infra/scripts/backup-db.sh
          bash -n infra/scripts/restore-db.sh
          bash -n infra/scripts/verify-backup.sh
          bash -n infra/scripts/production-preflight.sh
          bash -n infra/scripts/staging-smoke.sh
          bash -n infra/scripts/staging-preflight.sh
          bash -n infra/scripts/backup-lib.sh
          bash -n infra/scripts/restore-drill.sh
          bash -n infra/scripts/backup-selftest.sh
          bash -n infra/monitoring/alert.sh
          bash -n infra/monitoring/healthcheck.sh
          bash -n infra/monitoring/selftest.sh

      # Encrypted, authenticated backups and the restore drill on synthetic data (throwaway containers).
      - name: Backup encryption, authentication and restore drill self-test
        run: bash infra/scripts/backup-selftest.sh

      - name: Monitoring and alerting self-test
        run: bash infra/monitoring/selftest.sh

      # Actual production Caddyfile syntax and HTTP request-size enforcement.
      # Tests use an isolated Docker network and a mock API that consumes request bodies.
      - name: Validate Caddy request limits (F-08)
        run: |
          bash -n infra/scripts/verify-caddy-limits.sh
          bash infra/scripts/verify-caddy-limits.sh

      - name: Staging env isolation (synthetic CI-only credentials)
        run: |
          bash -n infra/scripts/staging-preflight-ci.sh
          bash infra/scripts/staging-preflight-ci.sh

      - name: Validate content intake templates
        run: node scripts/validate-content-intake.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Validate n8n workflows and inquiry email template
        run: pnpm n8n:validate

      - name: Build
        run: pnpm build --concurrency=2

      - name: Worker smoke
        run: pnpm worker:smoke

      - name: Acceptance suites (Phase 4 → 18)
        run: |
          set -e
          for n in $(seq 4 18); do
            echo "::group::Phase $n acceptance"
            pnpm test:acceptance:phase$n
            echo "::endgroup::"
          done

      # Boots the built API (FEATURE_SERVICES=true) and drives the Services
      # Foundation endpoints over HTTP: validation, idempotency, rate limits,
      # file checks, ownership/IDOR, RBAC, transitions and audit trail.
      - name: Acceptance suite (Services Foundation)
        run: pnpm test:acceptance:services

      # ST01 tests exercise real API + DB + browser and axe at 1440/768/390
      # with the Services-off CTA. Form mode remains a separate staging gate.
      - name: ST01 Playwright browser acceptance (CTA)
        run: |
          bash -n infra/scripts/st01-playwright-ci.sh
          bash infra/scripts/st01-playwright-ci.sh

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=200 postgres redis || true
          docker logs nexustheme-minio || true

  # Portal, Admin, purchase flow and AD10 reconciliation in a real browser against the API, worker,
  # PostgreSQL, Redis and MinIO of this throwaway runner (fresh database, synthetic credentials, local SePay
  # mock). Storefront/Portal/Admin run under `next dev` because dev-token login does not exist in production
  # builds. Separate from `verify` so its servers and data never meet the ST01 run.
  e2e-fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace
      REDIS_URL: redis://localhost:6379
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: marketplace-dev
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_REGION: auto
      WEB_URL: http://localhost:3000
      PORTAL_URL: http://localhost:3001
      ADMIN_URL: http://localhost:3002
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PAYMENT_RETURN_BASE_URL: http://localhost:3001
      STRIPE_MOCK_CLIENT: "true"
      STRIPE_SECRET_KEY: sk_test_placeholder_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret
      STRIPE_WEBHOOK_TOLERANCE_SECONDS: "300"
      ENABLE_TEST_PAYMENT_PROVIDER: "true"
      TEST_PAYMENT_WEBHOOK_SECRET: ci-test-payment-secret
      LICENSE_KEY_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      HOSTING_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SEED_DEV_USERS: "true"
      AUTOMATION_SERVICE_SECRET: test-automation-secret-minimum-32-chars-long
      N8N_WEBHOOK_BASE_URL: http://localhost:5678
      INTERNAL_HMAC_MAX_SKEW_SECONDS: "300"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL and Redis
        run: |
          docker compose up -d postgres redis
          for i in {1..40}; do
            if docker exec nexustheme-postgres pg_isready -U postgres -d marketplace >/dev/null 2>&1 && \
               docker exec nexustheme-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Start private MinIO
        run: |
          docker run -d --name nexustheme-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data --console-address ':9001'
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs nexustheme-minio
          exit 1

      - name: Create private MinIO bucket
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=minioadmin -e AWS_SECRET_ACCESS_KEY=minioadmin -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli:latest --endpoint-url http://127.0.0.1:9000 s3 mb s3://marketplace-dev

      - name: Setup test database
        run: |
          pnpm db:generate
          pnpm db:migrate
          pnpm db:seed:local

      # API, worker and the shared packages only: the three Next.js apps run under `next dev`.
      - name: Build API and worker
        run: pnpm turbo build --concurrency=2 --filter='!@nexus/web' --filter='!@nexus/portal' --filter='!@nexus/admin'

      - name: Install Playwright Chromium
        run: pnpm --filter @nexus/e2e exec playwright install --with-deps chromium

      - name: Full-stack Playwright acceptance (Portal, Admin, purchase flow, AD10)
        run: |
          bash -n infra/scripts/e2e-fullstack-ci.sh
          bash infra/scripts/e2e-fullstack-ci.sh

      - name: Upload Playwright traces and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fullstack-results
          path: apps/e2e/results
          retention-days: 7

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=200 postgres redis || true
          docker logs nexustheme-minio || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
          - target: worker
          - target: migrate
          - target: next
            app: web
          - target: next
            app: portal
          - target: next
            app: admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_URL=https://api.example.vn
            NEXT_PUBLIC_SITE_URL=https://example.vn
            NEXT_PUBLIC_PORTAL_URL=https://app.example.vn
